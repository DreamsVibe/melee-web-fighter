<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Ledge test page</title>
<style>
  html, body { margin: 0; height: 100%; background: #faf8f4; font: 18px Georgia, serif; }
  /* A line of text to stand on, and lower right of it a box whose top corners are ledges. */
  #line { position: absolute; left: 300px; top: 200px; width: 340px; margin: 0; text-align: right; }
  #box { position: absolute; left: 776px; top: 418px; width: 330px; height: 200px; background: #cfe3f6; border: 1px solid #9bbbd8; }
</style></head>
<body>
  <p id="line">Dash right off this line, drift back.</p>
  <div id="box"></div>
</body></html>
